          ${m !== null ? sgn(m) : (ben !== null ? `<span style="opacity:.6">${sgn(ben)}</span>` : '<span style="color:var(--ink-4)">—</span>')}</td>
        <td class="num" style="color:${colAge};white-space:nowrap">${j !== null ? j + ' j' : '—'}</td>
        <td><div class="row-act">
          <button class="btn ico sm" data-act="editArticle:${a.id}"><svg viewBox="0 0 24 24"><use href="#i-edit"/></svg></button>
          <button class="btn ico sm dgr" data-act="delArticle:${a.id}"><svg viewBox="0 0 24 24"><use href="#i-trash"/></svg></button>
        </div></td></tr>`;
    }).join('')}</tbody></table></div>`;
}
function selFiltre(vue, cle, opts, libVide) {
  const val = filtreVue(vue, cle);
  return `<select class="inp" style="width:auto;min-width:132px" data-filter="${vue}:${cle}">
    <option value="">${libVide}</option>
    ${opts.map(o => { const v = o.v !== undefined ? o.v : o, l = o.l !== undefined ? o.l : o;
      return `<option value="${esc(v)}" ${val === v ? 'selected' : ''}>${esc(l)}</option>`; }).join('')}</select>`;
}
function viewArticles() {
  const rows = articlesFiltres();
  return `
  <div class="head">
    <div><h1>Articles</h1><p>Une ligne par pièce : ce qu'elle t'a coûté, ce qu'elle rapporte, depuis combien de temps elle dort.</p></div>
    <div class="spacer"></div>
    <button class="btn pri" data-act="newArticle"><svg viewBox="0 0 24 24"><use href="#i-plus"/></svg>Nouvelle pièce</button>
  </div>
  <div class="filters">
    ${selFiltre('articles','statut', Object.keys(STATUTS).map(k => ({ v:k, l:STATUTS[k] })), 'Tous les statuts')}
    ${selFiltre('articles','categorie', valeursDe('categorie'), 'Toutes catégories')}
    ${selFiltre('articles','marque', valeursDe('marque'), 'Toutes marques')}
    ${selFiltre('articles','source', valeursDe('achat_source'), 'Toutes sources')}
    <div class="spacer"></div>
    <span class="chip">${rows.length} sur ${S.articles.length}</span>
  </div>
  <div class="glass card">
    ${rows.length ? tableArticles(rows, 'articles')
      : (S.articles.length
        ? emptyState('i-search', 'Aucune pièce ne correspond', 'Élargis la recherche ou remets les filtres à zéro.',
            `<button class="btn" data-act="clearFilters">Effacer les filtres</button>`)
        : emptyState('i-tag', 'Ton stock est vide',
            "Chaque ligne sera une pièce précise, achetée un jour à un prix et revendue un autre jour à un autre prix.",
            `<button class="btn pri" data-act="newArticle"><svg viewBox="0 0 24 24"><use href="#i-plus"/></svg>Ajouter une pièce</button>`))}
  </div>`;
}

/* ============================================================================
   VUE — STOCK DORMANT
   ============================================================================ */
function viewDormant() {
  const rows = S.articles.filter(estEnStock)
    .sort((a, b) => (jours(b.achat_date, aujourdhui()) || 0) - (jours(a.achat_date, aujourdhui()) || 0));
  const capital = capitalImmobilise(S.articles);
  const vieux = rows.filter(a => (jours(a.achat_date, aujourdhui()) || 0) > seuil());
  return `
  <div class="head">
    <div><h1>Stock dormant</h1><p>Du plus ancien au plus récent : le haut de la liste est ce qu'il faut brader.</p></div>
  </div>
  <div class="grid g3" style="margin-bottom:15px">
    ${kpiCard('Capital immobilisé', eur0(capital), 'i-box', '#FFB020',
      `<span>${rows.length} pièce${rows.length > 1 ? 's' : ''} non vendue${rows.length > 1 ? 's' : ''}</span>`)}
    ${kpiCard(`Au-delà de ${seuil()} jours`, String(vieux.length), 'i-clock', '#FF8A5B',
      `<span>${eur0(capitalImmobilise(vieux))} bloqués</span>`)}
    ${kpiCard('Coût moyen par pièce', eur0(rows.length ? capital / rows.length : 0), 'i-euro', '#5AC8FA',
      `<span>achat + frais annexes</span>`)}
  </div>
  <div class="glass card">
    ${rows.length ? tableArticles(rows, 'dormant')
      : emptyState('i-checkc', 'Rien ne dort',
          "Tout ce que tu as acheté est vendu. C'est bon signe — c'est peut-être aussi le moment de sourcer davantage.")}
  </div>`;
}

/* ============================================================================
   VUE — ESTIMATION
   ============================================================================ */
function viewPotentiel() {
  const p = potentielStock(S.articles, taux());
  const rows = S.articles.filter(estEnStock)
    .map(a => ({ a:a, est:estimer(S.articles, a), ben:beneficePotentiel(a, taux()) }))
    .sort((x, y) => (y.ben === null ? -1e9 : y.ben) - (x.ben === null ? -1e9 : x.ben));
  const mult = p.cout > 0 ? p.valeur / p.cout : 0;
  return `
  <div class="head">
    <div><h1>Estimation</h1><p>Ce que vaut ton stock, et ce qu'il te rapporterait s'il partait aux prix visés.</p></div>
    <div class="spacer"></div>
    <button class="btn pri" data-act="newArticle"><svg viewBox="0 0 24 24"><use href="#i-plus"/></svg>Nouvelle pièce</button>
  </div>
  <div class="grid g4" style="margin-bottom:15px">
    ${kpiCard('Valeur visée du stock', eur0(p.valeur), 'i-spark', '#A78BFA',
      `<span>${p.estimees} chiffrée${p.estimees > 1 ? 's' : ''} sur ${p.pieces}</span>`)}
    ${kpiCard('Bénéfice potentiel', sgn(p.benefice, true), 'i-trend', '#32D74B',
      `<span>commission de ${taux()} % déduite</span>`)}
    ${kpiCard('Multiple sur le capital', '×' + (Math.round(mult * 100) / 100).toString().replace('.', ','), 'i-target', '#2E8BFF',
      `<span>${eur0(p.cout)} investis</span>`)}
    ${kpiCard('Sans prix visé', String(p.sansPrix), 'i-alert', '#FF8A5B', `<span>pièces à chiffrer</span>`)}
  </div>
  <div class="grid g-23">
    <div class="glass card">
      <div class="card-h"><div><h3>Pièces en stock</h3><div class="sub">Triées par bénéfice espéré</div></div></div>
      ${rows.length ? `<div class="tbl-scroll"><table>
        <thead><tr><th>Pièce</th><th class="num">Prix visé</th><th class="num">Bénéfice</th>
          <th>Estimation d'après tes ventes</th><th class="num">Coût</th><th class="nos"></th></tr></thead>
        <tbody>${rows.map(x => `<tr>
          <td class="str"><div>${esc(x.a.titre)}</div>
            <div style="font-size:11.5px;color:var(--ink-3);font-weight:450">
              ${[esc(x.a.marque), esc(x.a.categorie), esc(x.a.etat)].filter(Boolean).join(' · ') || '—'}</div></td>
          <td class="num">${prixReference(x.a) === null ? '<span style="color:var(--ink-4)">à chiffrer</span>'
            : eur0(prixReference(x.a)) + (x.a.prix_estime ? '' : '<div style="font-size:11px;color:var(--ink-4)">prix affiché</div>')}</td>
          <td class="num str" style="color:${colMarge(x.ben)}">${x.ben === null ? '<span style="color:var(--ink-4)">—</span>' : sgn(x.ben)}</td>
          <td style="font-size:12.5px;color:var(--ink-2)">${x.est
            ? `<b>${eur0(x.est.prix)}</b> <span style="color:var(--ink-3)">${eur0(x.est.bas)}–${eur0(x.est.haut)}</span>
               <div style="font-size:11px;color:var(--ink-3)">${x.est.n} ventes · ${esc(x.est.base)}${x.est.delai !== null ? ' · ' + x.est.delai + ' j' : ''}</div>`
            : '<span style="color:var(--ink-4)">pas assez de ventes comparables</span>'}</td>
          <td class="num" style="color:var(--ink-3)">${eur0(coutRevient(x.a))}</td>
          <td><div class="row-act">
            <button class="btn ico sm" data-act="editArticle:${x.a.id}"><svg viewBox="0 0 24 24"><use href="#i-edit"/></svg></button>
          </div></td></tr>`).join('')}</tbody></table></div>`
        : emptyState('i-spark', 'Aucune pièce en stock',
            "Cet écran chiffre ce que ton stock devrait rapporter. L'estimation se construit sur tes propres ventes.",
            `<button class="btn pri" data-act="newArticle"><svg viewBox="0 0 24 24"><use href="#i-plus"/></svg>Ajouter une pièce</button>`)}
    </div>
    <div class="glass card" style="align-self:flex-start">
      <div class="card-h"><div><h3>Comment c'est calculé</h3><div class="sub">Aucune donnée extérieure</div></div></div>
      <p style="font-size:13px;color:var(--ink-2);line-height:1.65">
        Le prix proposé est la <b>médiane</b> de tes ventes comparables : d'abord même marque, catégorie et état ;
        à défaut même marque et catégorie ; puis même marque ; puis même catégorie.</p>
      <p style="font-size:13px;color:var(--ink-2);line-height:1.65;margin-top:10px">
        Un palier n'est retenu qu'à partir de <b>trois ventes</b> — en dessous, une médiane sur deux points est une
        coïncidence. Et c'est la médiane, pas la moyenne : un coup de chance à 300 € ne doit pas gonfler
        l'estimation de tout ton stock.</p>
      <p style="font-size:13px;color:var(--ink-2);line-height:1.65;margin-top:10px">
        Volontairement ton historique et pas un prix moyen Vinted : ce qui compte est ce que <em>toi</em> obtiens,
        avec tes photos et ta façon de négocier.</p>
    </div>
  </div>`;
}

/* ============================================================================
   VUE — TRÉSORERIE
   ============================================================================ */
function viewTresorerie() {
  const b = bornes(S.periode);
  const f = fluxTresorerie(S.articles, S.charges, S.mouvements, b);
  const cumul = fluxTresorerie(S.articles, S.charges, S.mouvements, null);
  const immobilise = capitalImmobilise(S.articles);
  const investi = c(cumul.apports - cumul.retraits);
  const gain = c(cumul.encaisse - cumul.achats - cumul.charges);
  const roi = investi > 0 ? c(gain / investi * 100) : null;
  const serie = serieTresorerie(S.articles, S.charges, S.mouvements, 12)
    .map(x => ({ label:x.mois, v:x.solde }));
  const lignes = [
    ['Apports', f.apports, '#32D74B', 1],
    ['Ventes encaissées, nettes de frais', f.encaisse, '#5AC8FA', 1],
    ['Achats de pièces', f.achats, '#FF8A5B', -1],
    ['Charges', f.charges, '#FFD426', -1],
    ['Retraits personnels', f.retraits, '#A78BFA', -1]
  ];
  return `
  <div class="head">
    <div><h1>Trésorerie</h1><p>Ce que tu as mis, ce qui est revenu, ce qui dort encore en stock.</p></div>
    <div class="spacer"></div>
    ${segPeriode()}
    <button class="btn pri" data-act="newMouvement"><svg viewBox="0 0 24 24"><use href="#i-plus"/></svg>Mouvement</button>
  </div>
  <div class="grid g4" style="margin-bottom:15px">
    ${kpiCard('Cash disponible', eur0(cumul.flux), 'i-euro', cumul.flux < 0 ? '#FF453A' : '#2E8BFF',
      `<span>apports − retraits + ventes − achats − charges</span>`)}
    ${kpiCard('Apport net', eur0(investi), 'i-down', '#32D74B',
      `<span>${eur0(cumul.apports)} mis · ${eur0(cumul.retraits)} sortis</span>`)}
    ${kpiCard('Immobilisé en stock', eur0(immobilise), 'i-box', '#FFB020',
      `<span>du cash qui ne travaille pas encore</span>`)}
    ${kpiCard('Retour sur apport', roi === null ? '—' : (roi > 0 ? '+' : '') + Math.round(roi) + ' %', 'i-target', '#A78BFA',
      `<span>${sgn(gain, true)} générés depuis le début</span>`)}
  </div>
  <div class="grid g-23" style="margin-bottom:15px">
    <div class="glass card">
      <div class="card-h"><div><h3>Évolution du cash</h3>
        <div class="sub">Solde à la fin de chaque mois, apports compris</div></div></div>
      ${chartBars(serie)}
    </div>
    <div class="glass card">
      <div class="card-h"><div><h3>Flux de la période</h3><div class="sub">Ce qui est entré et sorti</div></div></div>
      ${lignes.map(([lbl, val, col, sens]) => `<div class="stock-item">
        <span class="dot" style="background:${col}"></span>
        <div style="flex:1;font-size:13px">${lbl}</div>
        <div class="num str" style="color:${sens > 0 ? 'var(--success)' : '#FF9E80'}">${sens > 0 ? '+' : '−'}${eur(val)}</div>
      </div>`).join('')}
      <div class="totals" style="display:flex;align-items:center">
        <div style="flex:1;font-size:13px;font-weight:640">Variation nette</div>
        <div class="num" style="font-size:17px;font-weight:700;color:${colMarge(f.flux)}">${sgn(f.flux)}</div>
      </div>
    </div>
  </div>
  <div class="glass card">
    <div class="card-h"><div><h3>Apports et retraits</h3>
      <div class="sub">Seulement l'argent que tu mets ou que tu sors — les achats, ventes et charges sont déjà comptés ailleurs</div></div></div>
    ${S.mouvements.length ? `<div class="tbl-scroll"><table>
      <thead><tr><th>Libellé</th><th>Nature</th><th class="num">Date</th><th class="num">Montant</th><th class="nos"></th></tr></thead>
      <tbody>${S.mouvements.map(m => `<tr>
        <td class="str">${esc(m.libelle || (m.type === 'apport' ? 'Apport' : 'Retrait'))}</td>
        <td><span class="pill" style="background:${m.type === 'apport' ? '#32D74B1f' : '#A78BFA1f'};
          color:${m.type === 'apport' ? '#32D74B' : '#A78BFA'}">${m.type === 'apport' ? 'Apport' : 'Retrait'}</span></td>
        <td class="num" style="color:var(--ink-3);white-space:nowrap">${dfr(m.date_mouvement)}</td>
        <td class="num str" style="color:${m.type === 'apport' ? 'var(--success)' : '#FF9E80'}">
          ${m.type === 'apport' ? '+' : '−'}${eur(m.montant)}</td>
        <td><div class="row-act">
          <button class="btn ico sm" data-act="editMouvement:${m.id}"><svg viewBox="0 0 24 24"><use href="#i-edit"/></svg></button>
          <button class="btn ico sm dgr" data-act="delMouvement:${m.id}"><svg viewBox="0 0 24 24"><use href="#i-trash"/></svg></button>
        </div></td></tr>`).join('')}</tbody></table></div>`
      : emptyState('i-euro', 'Aucun apport enregistré',
          "Commence par ton apport de départ — la somme sortie de ta poche pour lancer l'activité. Sans elle, le cash restera négatif tant que tes premières ventes ne seront pas encaissées.",
          `<button class="btn pri" data-act="newMouvement"><svg viewBox="0 0 24 24"><use href="#i-plus"/></svg>Enregistrer l'apport</button>`)}
  </div>`;
}

/* ============================================================================
   VUE — RAPPORTS
   ============================================================================ */
function blocDim(titre, sous, champ, clos) {
  const d = parDimension(clos, champ);
  const max = Math.max(1, ...d.map(x => Math.abs(x.marge)));
  return `<div class="glass card">
    <div class="card-h"><div><h3>${titre}</h3><div class="sub">${sous}</div></div></div>
    ${d.length ? d.map(x => `<div style="padding:9px 0;border-top:1px solid rgba(255,255,255,.055)">
      <div style="display:flex;gap:10px;font-size:13px;margin-bottom:6px">
        <span class="str" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.cle)}</span>
        <span class="num str" style="color:${colMarge(x.marge)}">${sgn(x.marge)}</span>
        <span style="color:var(--ink-3);font-size:12px">${x.n} op.</span></div>
      <div class="pbar"><i style="width:${Math.abs(x.marge) / max * 100}%;background:${x.marge < 0 ? '#FF6B5B' : 'var(--accent)'}"></i></div>
    </div>`).join('') : `<div style="color:var(--ink-3);font-size:13px">Aucune opération close sur la période.</div>`}
  </div>`;
}
function viewRapports() {
  const b = bornes(S.periode);
  const clos = S.articles.filter(a => margeNette(a) !== null && dansPeriode(dateResultat(a), b));
  const delai = delaiMoyenVente(S.articles.filter(a => dansPeriode(dateResultat(a), b)));
  const tv = tauxDeVente(S.articles, b);
  const rang = [...clos].sort((x, y) => margeNette(y) - margeNette(x));
  const listeOps = (arr, titre, sous) => `<div class="glass card">
    <div class="card-h"><div><h3>${titre}</h3><div class="sub">${sous}</div></div></div>
    ${arr.length ? arr.map(a => `<div class="stock-item" data-act="editArticle:${a.id}" style="cursor:pointer">
      <div style="flex:1;min-width:0">
        <div class="str" style="font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.titre)}</div>
        <div style="font-size:11.5px;color:var(--ink-3)">${esc(a.achat_source || 'source inconnue')} · acheté ${eur0(a.achat_prix)}
          ${jours(a.achat_date, a.vente_date) !== null ? ' · ' + jours(a.achat_date, a.vente_date) + ' j en stock' : ''}</div></div>
      <div class="num str" style="color:${colMarge(margeNette(a))}">${sgn(margeNette(a))}</div>
    </div>`).join('') : `<div style="color:var(--ink-3);font-size:13px">Pas encore d'opération close.</div>`}
  </div>`;
  return `
  <div class="head">
    <div><h1>Rapports</h1><p>Où va la marge, et d'où elle vient.</p></div>
    <div class="spacer"></div>${segPeriode()}
  </div>
  <div class="grid g3" style="margin-bottom:15px">
    ${kpiCard('Délai moyen de vente', delai !== null ? delai + ' j' : '—', 'i-clock', '#5AC8FA', `<span>de l'achat à la vente</span>`)}
    ${kpiCard('Taux de vente', tv ? Math.round(tv.taux) + ' %' : '—', 'i-target', '#32D74B',
      `<span>${tv ? tv.vendus + ' vendus sur ' + tv.acquis + ' achetés' : 'aucun achat sur la période'}</span>`)}
    ${kpiCard('Opérations closes', String(clos.length), 'i-checkc', '#A78BFA', `<span>ventes, retours et pertes</span>`)}
  </div>
  <div class="grid g2" style="margin-bottom:15px">
    ${blocDim('Marge par catégorie', 'Ce qui rapporte, par type de pièce', 'categorie', clos)}
    ${blocDim('Marge par marque', 'Les marques qui tiennent leur promesse', 'marque', clos)}
  </div>
  <div class="grid g2">
    ${listeOps(rang.slice(0, 5), 'Meilleures opérations', 'À reproduire')}
    ${listeOps(rang.slice(-5).reverse().filter(a => margeNette(a) < 0), 'Pires opérations', 'À comprendre avant de recommencer')}
  </div>`;
}

/* ============================================================================
   VUE — SOURCES D'ACHAT
   ============================================================================ */
function viewSources() {
  const b = bornes(S.periode);
  const clos = S.articles.filter(a => margeNette(a) !== null && dansPeriode(dateResultat(a), b));
  const d = parDimension(clos, 'achat_source');
  const seg = d.filter(x => x.ca > 0).map((x, i) => ({ n:x.cle, c:HUES[i % HUES.length], v:x.ca }));
  const detail = d.map(x => {
    const arts = S.articles.filter(a => ((a.achat_source || '').trim() || 'Non renseigné') === x.cle);
    const vendus = arts.filter(a => a.statut === 'vendu');
    return Object.assign({}, x, {
      total:arts.length, vendus:vendus.length, delai:delaiMoyenVente(arts),
      pertes:arts.filter(a => a.statut === 'perte').length, stock:capitalImmobilise(arts),
      tauxVente: arts.length ? c(vendus.length / arts.length * 100) : 0
    });
  });
  const max = Math.max(1, ...detail.map(x => Math.abs(x.marge)));
  return `
  <div class="head">
    <div><h1>Sources d'achat</h1><p>Où sourcer davantage, et où arrêter.</p></div>
    <div class="spacer"></div>${segPeriode()}
  </div>
  <div class="grid g-23">
    <div class="glass card">
      <div class="card-h"><div><h3>Détail par source</h3>
        <div class="sub">Marge sur la période, délais sur tout l'historique</div></div></div>
      ${detail.length ? detail.map(x => `<div style="padding:11px 0;border-top:1px solid rgba(255,255,255,.055)">
        <div style="display:flex;gap:10px;font-size:13px;margin-bottom:6px">
          <span class="str" style="flex:1">${esc(x.cle)}</span>
          <span class="num str" style="color:${colMarge(x.marge)}">${sgn(x.marge)}</span></div>
        <div class="pbar"><i style="width:${Math.abs(x.marge) / max * 100}%;background:${x.marge < 0 ? '#FF6B5B' : 'var(--accent)'}"></i></div>
        <div style="font-size:11.5px;color:var(--ink-3);margin-top:6px">
          ${x.vendus}/${x.total} vendus (${Math.round(x.tauxVente)} %)${x.delai !== null ? ' · ' + x.delai + ' j en moyenne' : ''}${x.pertes ? ' · ' + x.pertes + ' perte' + (x.pertes > 1 ? 's' : '') : ''}${x.stock ? ' · ' + eur0(x.stock) + ' encore en stock' : ''}</div>
      </div>`).join('') : emptyState('i-box', 'Aucune opération close', 'Les sources se compareront dès tes premières ventes.')}
    </div>
    <div class="glass card" style="align-self:flex-start">
      <div class="card-h"><div><h3>Part du CA</h3><div class="sub">Qui fait tourner la boutique</div></div></div>
      ${chartDonut(seg)}
      <div class="legend">${seg.map(x => `<div class="leg"><i style="background:${x.c}"></i>
        <span>${esc(x.n)}</span><b>${eur0(x.v)}</b></div>`).join('')}</div>
    </div>
  </div>`;
}

/* ============================================================================
   VUE — ACHETEURS
   ============================================================================ */
function viewAcheteurs() {
  const d = parAcheteur(S.articles);
  const fideles = d.filter(x => x.n > 1);
  const sansNom = S.articles.filter(a => a.statut === 'vendu' && !(a.acheteur || '').trim()).length;
  const panier = d.length ? d.reduce((s, x) => s + x.ca, 0) / d.reduce((s, x) => s + x.n, 0) : 0;
  return `

  const total = c(duPeriode.reduce((s, x) => s + n(x.montant), 0));
  const parCat = [...duPeriode.reduce((m, x) => {

            </div></td></tr>`).join('')}</tbody></table></div>`

              "Note ici ce que tu dépenses sans pouvoir l'attribuer à un article. Ces montants ne toucheront pas la marge d'une pièce, mais viendront en déduction du résultat.",
              `<button class="btn pri" data-act="newCharge"><svg viewBox="0 0 24 24"><use href="#i-plus"/></svg>Ajouter une charge</button>`)}
      </div>
    </div>
    <div class="glass card" style="align-self:flex-start">

function openModal(html) {
  $('#modalRoot').innerHTML = `<div class="scrim" id="scrim">${html}</div>`;
  const scrim = $('#scrim');
  scrim.addEventListener('mousedown', e => { if (e.target === scrim) closeModal(); });
  wireModal();
  setTimeout(() => { const f = $('#scrim .inp:not([type=date])'); if (f && window.innerWidth > 900) f.focus(); }, 90);
}
function closeModal() { $('#modalRoot').innerHTML = ''; }
function confirmer(titre, texte, libelle) {
  return new Promise(res => {
    openModal(`<div class="sheet narrow">
      <div class="sheet-h"><div><h2>${esc(titre)}</h2></div></div>
      <div class="sheet-b" style="font-size:13.5px;color:var(--ink-2);line-height:1.6">${esc(texte)}</div>

function lireArticle() {
  const v = i => { const e = document.getElementById(i); return e ? e.value : ''; };
  const num = i => { const x = v(i); return x === '' ? null : n(x); };
  return {
    titre:v('fTitre').trim(), marque:v('fMarque').trim() || null, categorie:v('fCat').trim() || null,
    taille:v('fTaille').trim() || null, etat:v('fEtat') || null, reference:v('fRef').trim() || null,
    achat_date:v('fAchatDate') || aujourdhui(), achat_prix:num('fAchatPrix') || 0,
    achat_source:v('fSource') || null, achat_frais:num('fAchatFrais') || 0,
    prix_estime:num('fPrixEstime'),
    enligne_date:v('fEnligneDate') || null, enligne_prix:num('fEnlignePrix'),
    plateforme:v('fPlateforme') || null, annonce_url:v('fUrl').trim() || null,
    vente_date:v('fVenteDate') || null, vente_prix:num('fVentePrix'),
    vente_frais_plateforme:num('fFrais') || 0, vente_port:num('fPort') || 0,
    acheteur:v('fAcheteur').trim() || null, expedition:v('fExpedition').trim() || null,
    statut:v('fStatut'), notes:v('fNotes').trim() || null
  };
}
/* Aperçu en direct : voir la marge bouger pendant la saisie évite de valider
   une vente à perte sans s'en rendre compte. */
function majApercu() {
  const val = $('#apercuVal'); if (!val) return;
  const a = lireArticle();
  const m = margeNette(a), ben = beneficePotentiel(a, taux());
  const lib = $('#apercuLib');
  if (m !== null) {
    val.textContent = sgn(m); val.style.color = colMarge(m); val.style.opacity = 1;
    lib.textContent = `nette · coût de revient ${eur(coutRevient(a))} + frais ${eur(fraisVente(a))}`;
  } else if (ben !== null) {
    val.textContent = sgn(ben); val.style.color = colMarge(ben); val.style.opacity = .8;
    lib.textContent = `espérée au prix visé, commission de ${taux()} % déduite`;
  } else {
    val.textContent = eur(coutRevient(a)); val.style.color = 'var(--ink-2)'; val.style.opacity = 1;
    lib.textContent = 'coût de revient — ajoute un prix visé pour estimer la marge';
  }
  majEstimation(a);
}
/* Suggestion recalculée à chaque frappe : changer la marque ou l'état change
   le jeu de comparables, donc le prix proposé. */
function majEstimation(a) {
  const zone = $('#blocEstim'); if (!zone) return;
  const e = estimer(S.articles, Object.assign({ id:S.ficheId }, a));
  if (!e) {
    zone.innerHTML = `<span style="color:var(--ink-4)">Pas encore assez de ventes comparables.
      Renseigne marque, catégorie et état — l'estimation apparaît dès trois ventes semblables.</span>`;
    return;
  }
  const ben = beneficePotentiel({ statut:'achete', prix_estime:e.prix,
    achat_prix:a.achat_prix, achat_frais:a.achat_frais }, taux());
  zone.innerHTML = `<b style="font-size:17px;letter-spacing:-.4px">${eur0(e.prix)}</b>
    <span style="color:var(--ink-3)"> ${eur0(e.bas)}–${eur0(e.haut)}</span>
    <div style="font-size:11.5px;color:var(--ink-3);margin-top:2px">${e.n} vente${e.n > 1 ? 's' : ''} · ${esc(e.base)}${e.delai !== null ? ' · ' + e.delai + ' j' : ''}</div>
    <div style="font-size:12px;margin-top:3px;color:${colMarge(ben)}">bénéfice à ce prix : ${sgn(ben)}</div>
    <button class="btn sm" id="btnEstim" style="margin-top:8px">Reprendre ce prix</button>`;
  const b = $('#btnEstim');
  if (b) b.onclick = () => { $('#fPrixEstime').value = decf(e.prix); majApercu(); };
}
function prefixerParStatut() {
  const st = $('#fStatut').value;
  if (st === 'en_ligne' && !$('#fEnligneDate').value) $('#fEnligneDate').value = aujourdhui();
  if (st === 'vendu' && !$('#fVenteDate').value) $('#fVenteDate').value = aujourdhui();
  if (st === 'vendu' && !$('#fVentePrix').value)
    $('#fVentePrix').value = $('#fEnlignePrix').value || $('#fPrixEstime').value;
  if (st === 'vendu' && taux() > 0 && !n($('#fFrais').value))
    $('#fFrais').value = decf(c(n($('#fVentePrix').value) * taux() / 100));
  majApercu();
}
async function sauverArticle(id) {
  const a = lireArticle();
  if (!a.titre) { toast('Il faut au moins un titre pour retrouver la pièce.', 'er'); return; }
  if (a.statut === 'vendu' && (a.vente_prix === null || !a.vente_date)) {
    toast("Une pièce vendue a besoin d'une date et d'un prix de vente.", 'er'); return; }
  const r = id ? await db.from('articles').update(a).eq('id', id) : await db.from('articles').insert(a);
  if (r.error) { toast(r.error.message, 'er'); return; }
  closeModal(); await recharger();
  toast(id ? 'Pièce enregistrée.' : 'Pièce ajoutée.');
}
async function supprimerArticle(id) {
  const a = S.articles.find(x => x.id === id);
  if (!await confirmer('Supprimer cette pièce ?',
    `« ${a ? a.titre : ''} » disparaîtra aussi des rapports et de la trésorerie.`)) return;
  const r = await db.from('articles').delete().eq('id', id);
  if (r.error) { toast(r.error.message, 'er'); return; }
  closeModal(); await recharger(); toast('Pièce supprimée.');
}
/* Changement de statut depuis la ligne. Passer à « vendu » exige une date et un
   prix : on ouvre la fiche plutôt que d'écrire une vente incomplète que la
   contrainte de la base refuserait de toute façon. */
async function changerStatut(id, st) {
  const a = S.articles.find(x => x.id === id);
  if (!a) return;
  if (st === 'vendu' && (!a.vente_date || a.vente_prix === null)) {
    toast('Complète la date et le prix de vente.', 'in');
    modalArticle(id);
    setTimeout(() => { $('#fStatut').value = 'vendu'; prefixerParStatut(); }, 80);
    return;
  }
  const maj = { statut:st };
  if (st === 'en_ligne' && !a.enligne_date) maj.enligne_date = aujourdhui();
  const r = await db.from('articles').update(maj).eq('id', id);
  if (r.error) { toast(r.error.message, 'er'); return; }
  await recharger(); toast(STATUTS[st] + '.');
}

/* ---------- Charges ---------- */

  const x = id ? S.charges.find(y => y.id === id) : { date_charge:aujourdhui(), montant:'' };
  if (!x) return;
  openModal(`<div class="sheet narrow">
    <div class="sheet-h"><div><h2>${id ? 'Modifier la charge' : 'Nouvelle charge'}</h2>
      <p>Une dépense qui ne se rattache à aucune pièce.</p></div>
      <div class="spacer"></div>
      <button class="btn ico" data-close><svg viewBox="0 0 24 24"><use href="#i-x"/></svg></button></div>
    <div class="sheet-b"><div class="form-grid">
      ${fTxt('cLib', 'Libellé', x.libelle, 'Rouleau de scotch, essence tournée Niort…', 'text', true)}
      ${fTxt('cDate', 'Date', x.date_charge || aujourdhui(), '', 'date')}
      ${fEuro('cMontant', 'Montant (€)', x.montant)}
      <div class="field"><label for="cCat">Catégorie</label>
        <select class="inp" id="cCat"><option value=""></option>${['Emballage','Carburant','Abonnement','Matériel','Frais bancaires','Autre']
          .map(v => `<option ${(x.categorie || '') === v ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
      ${fTxt('cNotes', 'Notes', x.notes)}
    </div></div>
    <div class="sheet-f">
      ${id ? `<button class="btn dgr" data-act="delCharge:${x.id}"><svg viewBox="0 0 24 24"><use href="#i-trash"/></svg>Supprimer</button>` : ''}
      <div class="spacer"></div>
      <button class="btn" data-close>Annuler</button>
      <button class="btn pri" id="btnSaveCharge"><svg viewBox="0 0 24 24"><use href="#i-check"/></svg>Enregistrer</button>
    </div></div>`);
  $('#btnSaveCharge').onclick = async () => {
    const v = i => { const e = document.getElementById(i); return e ? e.value : ''; };
    const ch = { libelle:v('cLib').trim(), date_charge:v('cDate') || aujourdhui(),
                 montant:n(v('cMontant')), categorie:v('cCat') || null, notes:v('cNotes').trim() || null };
    if (!ch.libelle) { toast('Donne un libellé à la charge.', 'er'); return; }
    if (!ch.montant) { toast('Le montant ne peut pas être vide.', 'er'); return; }
    const r = id ? await db.from('charges').update(ch).eq('id', id) : await db.from('charges').insert(ch);
    if (r.error) { toast(r.error.message, 'er'); return; }
    closeModal(); await recharger(); toast('Charge enregistrée.');
  };
}
async function supprimerCharge(id) {
  if (!await confirmer('Supprimer cette charge ?', 'Elle ne pèsera plus sur le résultat ni sur la trésorerie.')) return;
  const r = await db.from('charges').delete().eq('id', id);
  if (r.error) { toast(r.error.message, 'er'); return; }
  closeModal(); await recharger(); toast('Charge supprimée.');
}

/* ---------- Trésorerie ---------- */

  const m = id ? S.mouvements.find(x => x.id === id) : { date_mouvement:aujourdhui(), type:'apport', montant:'' };
  if (!m) return;
  openModal(`<div class="sheet narrow">
    <div class="sheet-h"><div><h2>${id ? 'Modifier le mouvement' : 'Nouveau mouvement'}</h2>
      <p>Seulement l'argent que tu mets ou que tu sors.</p></div>
      <div class="spacer"></div>
      <button class="btn ico" data-close><svg viewBox="0 0 24 24"><use href="#i-x"/></svg></button></div>
    <div class="sheet-b"><div class="form-grid">
      <div class="field full"><label for="mType">Nature</label>
        <select class="inp" id="mType">
          <option value="apport" ${m.type === 'apport' ? 'selected' : ''}>Apport — je mets de l'argent</option>
          <option value="retrait" ${m.type === 'retrait' ? 'selected' : ''}>Retrait — je me paie</option>
        </select></div>
      ${fTxt('mDate', 'Date', m.date_mouvement || aujourdhui(), '', 'date')}
      ${fEuro('mMontant', 'Montant (€)', m.montant)}
      ${fTxt('mLib', 'Libellé', m.libelle, 'Apport de départ, virement du compte perso…', 'text', true)}
    </div></div>
    <div class="sheet-f">
      ${id ? `<button class="btn dgr" data-act="delMouvement:${m.id}"><svg viewBox="0 0 24 24"><use href="#i-trash"/></svg>Supprimer</button>` : ''}
      <div class="spacer"></div>
      <button class="btn" data-close>Annuler</button>
      <button class="btn pri" id="btnSaveMvt"><svg viewBox="0 0 24 24"><use href="#i-check"/></svg>Enregistrer</button>
    </div></div>`);
  $('#btnSaveMvt').onclick = async () => {
    const v = i => { const e = document.getElementById(i); return e ? e.value : ''; };

                 montant:n(v('mMontant')), libelle:v('mLib').trim() || null };
    if (!mv.montant) { toast('Le montant ne peut pas être vide.', 'er'); return; }
    const r = id ? await db.from('tresorerie').update(mv).eq('id', id) : await db.from('tresorerie').insert(mv);
    if (r.error) { toast(r.error.message, 'er'); return; }
    closeModal(); await recharger(); toast('Mouvement enregistré.');
  };
}
async function supprimerMouvement(id) {
  if (!await confirmer('Supprimer ce mouvement ?', 'Le solde de trésorerie sera recalculé sans lui.')) return;
  const r = await db.from('tresorerie').delete().eq('id', id);
  if (r.error) { toast(r.error.message, 'er'); return; }
  closeModal(); await recharger(); toast('Mouvement supprimé.');
}

/* ============================================================================
   EXPORT
   ============================================================================ */
function versCSV(lignes, entetes) {
  const q = v => '"' + String(v === null || v === undefined ? '' : v).replace(/"/g, '""') + '"';
  /* Point-virgule + BOM : sans ça, Excel et Numbers en français mettent tout
     dans une seule colonne et cassent les accents. */
  return '\uFEFF' + [entetes].concat(lignes).map(l => l.map(q).join(';')).join('\r\n');
}
function telecharger(nom, contenu) {
  const url = URL.createObjectURL(new Blob([contenu], { type:'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = nom; document.body.appendChild(a); a.click();
  a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function exportArticles() {
  const e = ['Titre','Marque','Catégorie','Taille','État','Référence','Statut','Date achat','Prix achat',
             'Frais achat','Source','Date en ligne','Prix affiché','Plateforme','Date vente','Prix vente',
             'Frais plateforme','Port à ma charge','Acheteur','Prix visé','Coût de revient','Marge nette',
             'Bénéfice potentiel','Jours en stock'];
  const l = S.articles.map(a => [a.titre, a.marque, a.categorie, a.taille, a.etat, a.reference, STATUTS[a.statut],
    a.achat_date, a.achat_prix, a.achat_frais, a.achat_source, a.enligne_date, a.enligne_prix, a.plateforme,
    a.vente_date, a.vente_prix, a.vente_frais_plateforme, a.vente_port, a.acheteur, a.prix_estime,
    coutRevient(a), margeNette(a) === null ? '' : margeNette(a),
    beneficePotentiel(a, taux()) === null ? '' : beneficePotentiel(a, taux()),
    jours(a.achat_date, a.vente_date || aujourdhui())]);
  telecharger('articles-' + aujourdhui() + '.csv', versCSV(l, e));
}
function exportCharges() {
  telecharger('charges-' + aujourdhui() + '.csv',
    versCSV(S.charges.map(x => [x.date_charge, x.libelle, x.categorie, x.montant, x.notes]),
      ['Date','Libellé','Catégorie','Montant','Notes']));
}
function exportTreso() {
  telecharger('tresorerie-' + aujourdhui() + '.csv',
    versCSV(S.mouvements.map(m => [m.date_mouvement, m.type, m.montant, m.libelle]),
      ['Date','Nature','Montant','Libellé']));
}

/* ============================================================================
   ACTIONS ET CÂBLAGE
   ============================================================================ */
async function saveReglages() {
  const p = {
    objectif_mensuel:n($('#rObj').value),
    taux_commission_defaut:n($('#rTaux').value),
    seuil_dormant:Math.max(1, parseInt($('#rSeuil').value, 10) || 60)
  };
  const r = await db.from('parametres').update(p).eq('user_id', S.params.user_id);
  if (r.error) { toast(r.error.message, 'er'); return; }
  Object.assign(S.params, p); render(); toast('Réglages enregistrés.');
}
async function majApparence(champ, valeur) {
  S.params[champ] = valeur;
  if (champ === 'fond') S.params.theme = FONDS[valeur] && FONDS[valeur].clair ? 'clair' : 'sombre';
  appliquerTheme(S.params);
  render();
  const maj = {}; maj[champ] = valeur;
  if (champ === 'fond') maj.theme = S.params.theme;
  const r = await db.from('parametres').update(maj).eq('user_id', S.params.user_id);
  if (r.error) toast(r.error.message, 'er');
}
function runAction(act) {
  const [k, id] = act.split(':');
  const A = {
    newArticle: () => modalArticle(null),
    editArticle: () => modalArticle(id),
    delArticle: () => supprimerArticle(id),
    newCharge: () => modalCharge(null),
    editCharge: () => modalCharge(id),
    delCharge: () => supprimerCharge(id),
    newMouvement: () => modalMouvement(null),
    editMouvement: () => modalMouvement(id),
    delMouvement: () => supprimerMouvement(id),
    saveReglages: saveReglages,
    exportArticles: exportArticles,
    exportCharges: exportCharges,
    exportTreso: exportTreso,
    clearFilters: () => { S.filters.articles = {}; S.search = ''; $('#globalSearch').value = ''; render(); },
    chercher: () => { S.search = id; $('#globalSearch').value = id; go('articles'); },
    deconnexion: async () => { await db.auth.signOut(); location.reload(); }
  };
  if (A[k]) A[k]();
}
function wire() {
  $$('#main [data-act]').forEach(b => b.onclick = e => { e.stopPropagation(); runAction(b.dataset.act); });
  $$('#main [data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
  $$('#main [data-sort]').forEach(el => el.onclick = () => {
    const parts = el.dataset.sort.split(':');
    const st = sortState(parts[0]);
    if (st.key === parts[1]) st.dir *= -1; else { st.key = parts[1]; st.dir = parts[1] === 'achat' ? -1 : 1; }
    render();
  });
  $$('#main [data-filter]').forEach(el => el.onchange = () => {
    const parts = el.dataset.filter.split(':');
    (S.filters[parts[0]] || (S.filters[parts[0]] = {}))[parts[1]] = el.value;
    render();
  });
  $$('#main [data-statut]').forEach(el => el.onchange = () => changerStatut(el.dataset.statut, el.value));
  $$('#main [data-accent]').forEach(el => el.onclick = () => majApparence('accent', el.dataset.accent));
  $$('#main [data-fond]').forEach(el => el.onclick = () => majApparence('fond', el.dataset.fond));
  $$('#main [data-verre]').forEach(el => el.onclick = () => majApparence('verre', el.dataset.verre));
  const seg = $('#periodSeg');
  if (seg) $$('#periodSeg button').forEach(b => b.onclick = () => { S.periode = b.dataset.p; render(); });
}
function wireModal() {
  $$('#scrim [data-close]').forEach(b => b.onclick = closeModal);
  $$('#scrim [data-act]').forEach(b => b.onclick = e => { e.stopPropagation(); runAction(b.dataset.act); });
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#scrim')) closeModal();
  if (e.key === 'n' && (e.metaKey || e.ctrlKey) && !$('#scrim')) { e.preventDefault(); modalArticle(null); }
});

/* ============================================================================
   AUTHENTIFICATION ET DÉMARRAGE
   ============================================================================ */
async function connexion() {
  const err = $('#authErr');
  err.classList.add('hidden');
  const { error } = await db.auth.signInWithPassword({
    email: $('#aMail').value.trim(), password: $('#aPass').value
  });
  if (error) {
    err.textContent = "Connexion refusée. Vérifie l'e-mail et le mot de passe.";
    err.classList.remove('hidden');
    return;
  }
  demarrer();
}
async function demarrer() {
  $('#boot').classList.add('hidden');
  $('#authScreen').classList.add('hidden');
  $('#app').classList.remove('hidden');
  try {
    await charger();
    const { data } = await db.auth.getUser();
    const mail = data && data.user ? data.user.email : '';
    $('#userChip').textContent = (mail || '?').slice(0, 1).toUpperCase();
    $('#userChip').title = mail;
    $('#brandSub').textContent = S.articles.filter(estEnStock).length + ' pièces en stock';
    buildNav();
    go('bord');
  } catch (e) {
    toast('Chargement impossible : ' + e.message, 'er');
  }
}
/* La barre du haut vit en dehors de #main : wire() ne la parcourt pas, il faut
   la câbler une fois pour toutes au démarrage. */
$$('.topbar [data-act]').forEach(b2 => b2.onclick = () => runAction(b2.dataset.act));
$('#userChip').onclick = () => go('reglages');

$('#authGo').onclick = connexion;
['aMail', 'aPass'].forEach(i => $('#' + i).addEventListener('keydown', e => { if (e.key === 'Enter') connexion(); }));
$('#globalSearch').addEventListener('input', e => {
  S.search = e.target.value;
  if (S.vue !== 'articles') go('articles'); else render();
});

(async function init() {
  const { data } = await db.auth.getSession();
  $('#boot').classList.add('hidden');
  if (data.session) demarrer();
  else $('#authScreen').classList.remove('hidden');
})();

</script>
