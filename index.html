    <div class="sheet-f">
      ${e ? `<button class="btn dgr" data-act="videActivite:${e.id}">Vider les données</button>` : ''}

      <button class="btn" data-close>Annuler</button>

  </div>`);

  let couleur = e?.couleur || '#2E8BFF';
  $('#eCouleurs').querySelectorAll('[data-col]').forEach(b => b.onclick = () => {
    couleur = b.dataset.col;
    $('#eCouleurs').querySelectorAll('[data-col]').forEach(x => x.classList.toggle('on', x === b));
  });

  if (swCat) swCat.onclick = () => swCat.classList.toggle('on');

    const nom = $('#eNom').value.trim();
    if (!nom) { $('#eNom').classList.add('err'); return toast('Donnez un nom à cette activité.', 'er'); }
    const obj = Math.max(0, parseFloat($('#eObj').value) || 0);
    const sect = $('#eSecteur').value.trim();

    if (e) {
      const detail = {
        enseigne: $('#eEnseigne').value.trim(), telephone: $('#eTel').value.trim(),
        emailPro: $('#eMail').value.trim(), siret: $('#eSiret').value.trim(),
        adresse: $('#eAdresse').value.trim()
      };
      if (!await API.saveEntreprise({ id: e.id, nom, secteur: sect, objectif: obj, couleur, ...detail })) return;
      closeModal(); await recharger(); toast('Activité mise à jour.');
    } else {
      const nid = await API.creerActivite(nom, sect, swCat.classList.contains('on'));
      if (!nid) return;
      await API.saveEntreprise({ id: nid, nom, secteur: sect, objectif: obj, couleur });
      S.ent = nid;
      closeModal(); await recharger(); go('dash'); toast(`${nom} est prête.`);
    }
  };
}

/* ---------- Constructeur de lignes ---------- */
function renderLines(kind) {
  const box = $('#linesBox');
  if (!box) return;
  const prods = S.db.produits.filter(p => p.actif !== false);
  box.innerHTML = draft.lignes.map((l, i) => {
    const p = S.db.produits.find(x => x.id === l.produitId);
    const dispo = p ? Calc.stock(p.id) : 0;
    const champ = kind === 'vente' ? 'prix' : 'cout';
    return `<div class="line">
      <select class="inp" data-l="${i}:produitId">
        ${prods.map(x => `<option value="${x.id}" ${x.id === l.produitId ? 'selected' : ''}>${esc(x.nom)}</option>`).join('')}
      </select>
      <input class="inp" type="number" min="1" step="1" value="${l.qte}" data-l="${i}:qte" title="Quantité">
      <input class="inp" type="number" min="0" step="0.01" value="${l[champ]}" data-l="${i}:${champ}" title="${kind === 'vente' ? 'Prix unitaire' : 'Coût unitaire'}">
      <div class="tot">${eur(l.qte * l[champ])}</div>
      <button class="line-x" data-rml="${i}" title="Retirer"><svg viewBox="0 0 24 24"><use href="#i-x"/></svg></button>
      ${kind === 'vente' && l.qte > dispo ? `<div style="grid-column:1/-1;font-size:11px;color:#FFDF6B;margin-top:2px">
        Stock disponible : ${dispo} — la vente passera le stock en négatif.</div>` : ''}
    </div>`;
  }).join('') || `<div style="padding:18px;text-align:center;color:var(--ink-4);font-size:12.5px;border:1px dashed var(--stroke);border-radius:var(--r-sm)">Ajoutez au moins une ligne</div>`;

  box.querySelectorAll('[data-l]').forEach(el => {
    el.oninput = () => {
      const [i, f] = el.dataset.l.split(':');
      let v = el.value;
      if (f === 'qte') v = Math.max(1, parseInt(v) || 1);
      else if (f !== 'produitId') v = Math.max(0, parseFloat(v) || 0);
      if (f === 'produitId') {
        const p = S.db.produits.find(x => x.id === v);
        draft.lignes[i].produitId = v;
        if (p) draft.lignes[i][kind === 'vente' ? 'prix' : 'cout'] = kind === 'vente' ? (Number(p.prixRef) || 0) : (Number(p.coutRef) || 0);
        renderLines(kind);
      } else draft.lignes[i][f] = v;
      paintTotals(kind);
      if (f !== 'produitId') { const t = el.closest('.line').querySelector('.tot'); if (t) t.textContent = eur(draft.lignes[i].qte * draft.lignes[i][kind === 'vente' ? 'prix' : 'cout']); }
    };
    el.onchange = () => { if (el.dataset.l.endsWith(':qte')) renderLines(kind); };
  });
  box.querySelectorAll('[data-rml]').forEach(b => b.onclick = () => {
    draft.lignes.splice(+b.dataset.rml, 1); renderLines(kind); paintTotals(kind);
  });
  paintTotals(kind);
}

function paintTotals(kind) {
  const box = $('#totalsBox');
  if (!box) return;
  if (kind === 'vente') {
    const brut = draft.lignes.reduce((s, l) => s + l.qte * l.prix, 0);
    const remise = Math.max(0, parseFloat($('#fRemise')?.value) || 0);
    const cout = draft.lignes.reduce((s, l) => s + l.qte * Calc.pmp(l.produitId), 0);
    const net = brut - remise;
    box.innerHTML = `
      <div class="trow"><span>Sous-total</span><b>${eur(brut)}</b></div>
      ${remise ? `<div class="trow"><span>Remise accordée</span><b style="color:#FF9E80">−${eur(remise)}</b></div>` : ''}
      <div class="trow"><span>Coût de revient estimé</span><b style="color:var(--ink-3)">${eur(cout)}</b></div>
      <div class="trow mg"><span>Marge dégagée</span><b>${eur(net - cout)}${net ? ` <span style="font-size:11.5px;font-weight:560;color:var(--ink-3)">(${pct(((net - cout) / net) * 100)})</span>` : ''}</b></div>
      <div class="trow big"><span>Total encaissé</span><b>${eur(net)}</b></div>`;
  } else {
    const brut = draft.lignes.reduce((s, l) => s + l.qte * l.cout, 0);
    const frais = Math.max(0, parseFloat($('#fFrais')?.value) || 0);
    const u = draft.lignes.reduce((s, l) => s + l.qte, 0);
    box.innerHTML = `
      <div class="trow"><span>Marchandise</span><b>${eur(brut)}</b></div>
      ${frais ? `<div class="trow"><span>Frais de port et douane</span><b>${eur(frais)}</b></div>` : ''}
      <div class="trow"><span>Coût unitaire réel</span><b>${u ? eur((brut + frais) / u) : '—'}</b></div>
      <div class="trow big"><span>Total commande</span><b>${eur(brut + frais)}</b></div>`;
  }
}

      <div class="form-grid" style="margin-top:18px">
        <div class="field"><label for="fRemise">Remise accordée (€)</label>
          <input class="inp" id="fRemise" type="number" min="0" step="0.5" value="${v?.remise || 0}"></div>
        <div class="field"><label for="fNotes">Note interne</label>
          <input class="inp" id="fNotes" type="text" placeholder="Livrée en main propre…" value="${esc(v?.notes || '')}"></div>
      </div>

      <div class="totals" id="totalsBox"></div>
    </div>
    <div class="sheet-f"><div class="spacer"></div>
      <button class="btn" data-close>Annuler</button>
      <button class="btn pri" id="saveVente">${v ? 'Enregistrer les modifications' : 'Enregistrer la vente'}</button></div>
  </div>`);

  renderLines('vente');
  $('#addLine').onclick = () => { draft.lignes.push({ produitId: prods[0].id, qte: 1, prix: Number(prods[0].prixRef) || 0 }); renderLines('vente'); };
  $('#fRemise').oninput = () => paintTotals('vente');

  const majClient = () => {
    const neuf = $('#fClient').value === '__new';
    $('#ncBox').classList.toggle('hidden', !neuf);
    if (neuf) setTimeout(() => $('#ncEnseigne').focus(), 60);
  };
  $('#fClient').onchange = majClient;
  majClient();

  $('#saveVente').onclick = async () => {
    if (!draft.lignes.length) return toast('Ajoutez au moins un article.', 'er');

    let clientId = $('#fClient').value || null;

    /* création de la fiche client à la volée */
    if (clientId === '__new') {
      const enseigne = $('#ncEnseigne').value.trim();
      const prenom = $('#ncPrenom').value.trim();
      const nomC = $('#ncNom').value.trim();
      const libelle = enseigne || [prenom, nomC].filter(Boolean).join(' ').trim();
      if (!libelle) {
        $('#ncEnseigne').classList.add('err');
        return toast("Indiquez au moins l'enseigne ou le nom du client.", 'er');
      }
      const nouveau = {
        id: uid(), nom: libelle, prenom, nomContact: nomC,
        ville: $('#ncVille').value.trim(), tel: $('#ncTel').value.trim(),
        email: $('#ncMail').value.trim(), secteur: '', statut: 'client', notes: ''
      };
      const cree = await API.saveClient(nouveau);
      if (!cree) return;
      clientId = cree;
      toast(`${libelle} ajouté à vos clients.`);
    }

    const rec = {
      id: v?.id || uid(),
      clientId,
      date: $('#fDate').value || today(),
      moyen: $('#fMoyen').value,
      statut: $('#fStatut').value,
      remise: Math.max(0, parseFloat($('#fRemise').value) || 0),
      notes: $('#fNotes').value.trim(),
      lignes: draft.lignes.map(l => ({ produitId: l.produitId, qte: +l.qte, prix: +l.prix })),
      createdAt: v?.createdAt || new Date().toISOString()
    };
    if (v) S.db.ventes[S.db.ventes.findIndex(x => x.id === v.id)] = rec;
    else S.db.ventes.push(rec);
    if (await API.saveVente(rec) === null) return;
    if (rec.clientId) {
      const c = S.db.clients.find(x => x.id === rec.clientId);
      if (c && c.statut === 'prospect') { c.statut = 'client'; await API.saveClient(c); }
    }
    S.filters.ventes = S.filters.ventes || {};
    closeModal(); await recharger();
    toast(v ? 'Vente mise à jour.' : `Vente de ${eur(Calc.totalVente(rec))} enregistrée.`);
  };
}

function download(name, content, type = 'text/csv;charset=utf-8;') {
  const blob = new Blob(['\ufeff' + content], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  toast(`${name} téléchargé.`);
}
const csvCell = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
const csv = rows => rows.map(r => r.map(csvCell).join(';')).join('\r\n');

function exportVentes() {
  const rows = [['Date', 'Client', 'Ville', 'Articles', 'Quantité', 'Moyen de paiement', 'Statut', 'Remise', 'Coût de revient', 'Marge', 'Total']];
  for (const v of [...S.db.ventes].sort((a, b) => a.date.localeCompare(b.date))) {
    const c = S.db.clients.find(x => x.id === v.clientId);
    rows.push([v.date, clientName(v.clientId), c?.ville || '', v.lignes.map(l => `${l.qte}x ${produitName(l.produitId)}`).join(' + '),
      v.lignes.reduce((s, l) => s + l.qte, 0), v.moyen || '', v.statut, v.remise || 0,
      rnd(Calc.coutVente(v)), rnd(Calc.margeVente(v)), rnd(Calc.totalVente(v))]);
  }
  download(`ventes-${today()}.csv`, csv(rows));
}
function exportCmd() {
  const rows = [['Date', 'Fournisseur', 'Articles', 'Quantité', 'Frais', 'Statut', 'Total']];
  for (const c of [...S.db.commandes].sort((a, b) => a.date.localeCompare(b.date)))
    rows.push([c.date, c.fournisseur, c.lignes.map(l => `${l.qte}x ${produitName(l.produitId)}`).join(' + '),
      c.lignes.reduce((s, l) => s + l.qte, 0), c.frais || 0, c.statut, rnd(Calc.totalCommande(c))]);
  download(`commandes-${today()}.csv`, csv(rows));
}
function exportClients() {
  const rows = [['Nom', 'Contact', 'Ville', 'Téléphone', 'E-mail', 'Secteur', 'Statut', 'Nb ventes', 'CA généré', 'Notes']];
  for (const c of S.db.clients)
    rows.push([c.nom, contactNom(c), c.ville || '', c.tel || '', c.email || '', c.secteur || '', c.statut || '',
      S.db.ventes.filter(v => v.clientId === c.id && v.statut !== 'annulee').length, rnd(Calc.caClient(c.id)), c.notes || '']);
  download(`clients-${today()}.csv`, csv(rows));
}
function exportGlobal() {
  download(`scanavis-${today()}.json`, JSON.stringify({
    export: new Date().toISOString(),
    compte: { nom: S.user.name, email: S.user.email },
    activite: (S.db.entreprises || []).find(e => e.id === S.ent)?.nom || '',
    donnees: S.db
  }, null, 2), 'application/json');
}

   ============================================================================ */
async function seedDemo() {
  const P = S.db.produits;
  if (P.length < 3) return toast('Ajoutez au moins trois produits au catalogue.', 'er');

  const commerces = [['Le Comptoir des Halles', 'La Rochelle', 'Restauration'], ['Coiffure Éclat', 'Bordeaux', 'Beauté'],
    ['Garage Moreau', 'Dax', 'Automobile'], ['Boulangerie Saint-Jean', 'La Rochelle', 'Alimentation'],
    ['Pizzeria Vesuvio', 'Bordeaux', 'Restauration'], ['Institut Zen', 'Angoulême', 'Bien-être'],
    ['Fleurs & Sens', 'Niort', 'Commerce'], ['Auto-école Cap Sud', 'La Rochelle', 'Formation']];

  const { data: clients, error: e1 } = await sb.from('clients').insert(
    commerces.map((c, i) => ({ ...API.base(), nom: c[0], ville: c[1], secteur: c[2], statut: i < 6 ? 'client' : 'prospect' }))
  ).select();
  if (boum(e1)) return;

  const now = new Date();
  const iso = d => d.toISOString().slice(0, 10);

  const cmdRows = [];
  for (let m = 6; m >= 0; m -= 2) {
    cmdRows.push({
      ...API.base(), fournisseur: 'Shenzhen NFC Tech',
      date: iso(new Date(now.getFullYear(), now.getMonth() - m, 8)),
      statut: m === 0 ? 'transit' : 'recue', frais: 45 + m * 3,
      date_reception: m === 0 ? null : iso(new Date(now.getFullYear(), now.getMonth() - m, 22)),
      _m: m
    });
  }
  const { data: cmds, error: e2 } = await sb.from('commandes')
    .insert(cmdRows.map(({ _m, ...r }) => r)).select();
  if (boum(e2)) return;

  const cLignes = [];
  cmds.forEach((c, i) => {
    const m = cmdRows[i]._m;
    cLignes.push(
      { commande_id: c.id, ...API.base(), produit_id: P[0].id, qte: 40, cout: 3.1 + m * 0.05 },
      { commande_id: c.id, ...API.base(), produit_id: P[1].id, qte: 80, cout: 1.75 },
      { commande_id: c.id, ...API.base(), produit_id: P[2].id, qte: 60, cout: 1.05 });
  });
  if (boum((await sb.from('commande_lignes').insert(cLignes)).error)) return;

  const MOYENS = ['Espèces', 'Virement', 'Carte bancaire', 'PayPal'];
  const vRows = [], vMeta = [];
  for (let m = 5; m >= 0; m--) {
    const n = 3 + Math.floor(Math.random() * 5);
    for (let i = 0; i < n; i++) {
      const d = new Date(now.getFullYear(), now.getMonth() - m, 2 + Math.floor(Math.random() * 25));
      if (d > now) continue;
      const p = P[Math.floor(Math.random() * 3)];
      vRows.push({
        ...API.base(), client_id: clients[Math.floor(Math.random() * 6)].id, date: iso(d),
        moyen: MOYENS[Math.floor(Math.random() * MOYENS.length)],
        statut: Math.random() > 0.88 ? 'attente' : 'payee',
        remise: Math.random() > 0.8 ? 5 : 0
      });
      vMeta.push({ produit_id: p.id, qte: 1 + Math.floor(Math.random() * 3), prix: Number(p.prixRef) });
    }
  }
  const { data: ventes, error: e3 } = await sb.from('ventes').insert(vRows).select();
  if (boum(e3)) return;
  if (boum((await sb.from('vente_lignes').insert(
    ventes.map((v, i) => ({ vente_id: v.id, ...API.base(), ...vMeta[i] }))).error))) return;

  if (boum((await sb.from('charges').insert([
    { ...API.base(), libelle: 'Publicité Facebook', categorie: 'Publicité', montant: 120, date: today() },
    { ...API.base(), libelle: 'Carburant tournée commerciale', categorie: 'Déplacements', montant: 68.4, date: today() },
    { ...API.base(), libelle: 'Abonnement Canva Pro', categorie: 'Logiciels', montant: 11.99, date: today() }
  ])).error)) return;

  await recharger();
  toast('Jeu de démonstration chargé.');
}

function runAction(raw) {
  const [name, arg] = raw.split(':');
  const fn = ACTIONS[name];
  if (fn) fn(arg);
}

  $$('#scrim [data-close]').forEach(b => b.onclick = closeModal);
  $$('#scrim [data-act]').forEach(b => b.onclick = e => { e.stopPropagation(); runAction(b.dataset.act); });
  $$('#scrim [data-open]').forEach(el => el.onclick = e => {
    e.stopPropagation();
    const [k, id] = el.dataset.open.split(':');
    (k === 'vente' ? detailVente : detailClient)(id);
  });
}

  $$('#main [data-act]').forEach(b => b.onclick = e => { e.stopPropagation(); runAction(b.dataset.act); });

  $$('#main [data-open]').forEach(el => el.onclick = e => {
    e.stopPropagation();
    const [k, id] = el.dataset.open.split(':');
    (k === 'vente' ? detailVente : detailClient)(id);
  });
  $$('#main [data-sort]').forEach(el => el.onclick = () => {

  });

    const [view, key] = el.dataset.filter.split(':');

  });

  });
  const seg = $('#periodSeg');
  if (seg) seg.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { S.period = b.dataset.p; render(); });
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#scrim')) return closeModal();
  if (!S.user || $('#scrim') || /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
  const k = e.key.toLowerCase();
  if (k === 'v') { e.preventDefault(); modalVente(); }
  else if (k === 'c') { e.preventDefault(); modalCmd(); }
  else if (k === 'n') { e.preventDefault(); modalClient(); }
  else if (k === '/') { e.preventDefault(); $('#globalSearch').focus(); }
});

const _go = go;
go = function (view) {
  _go(view);
  if (view === 'admin' && S.user?.isAdmin) loadAdmin().then(render);
};

(async function boot() {
  paintAuth();
  if (SUPABASE_URL.includes('VOTRE-REF') || !SUPABASE_KEY.startsWith('sb_')) {
    $('#boot').innerHTML = `<div style="max-width:420px;text-align:center;padding:26px">
      <div class="auth-mark"><svg viewBox="0 0 24 24"><use href="#i-set"/></svg></div>
      <h1 style="font-size:20px;font-weight:680;margin-bottom:10px">Configuration requise</h1>
      <p style="font-size:13.5px;color:var(--ink-3);line-height:1.6">Renseignez <span class="mono">SUPABASE_URL</span>
      et <span class="mono">SUPABASE_KEY</span> en haut du fichier, puis exécutez
      <span class="mono">schema.sql</span> dans l'éditeur SQL de Supabase.</p></div>`;
    return;
  }
  if (!await chargerLibrairie()) {
    return panne('Librairie Supabase inaccessible',
      "Le script supabase-js n'a pas pu être téléchargé. Vérifiez votre connexion ou un bloqueur de contenu.");
  }
  try { creerClient(); }
  catch (e) { return panne('Connexion au projet impossible',
    'Vérifiez SUPABASE_URL et SUPABASE_KEY. Détail : ' + e.message); }
  try {
    const { data: { session } } = await Promise.race([
      sb.auth.getSession(),
      new Promise((_, rej) => setTimeout(() => rej(new Error('délai dépassé')), 8000))
    ]);
    if (session) { window.__demarre = true; $('#boot').classList.add('hidden'); await openSession(); return; }
  } catch (e) { console.error('getSession', e); }
  window.__demarre = true;
  $('#boot').classList.add('hidden');
  $('#authScreen').classList.remove('hidden');
})();
</script>

</body>
</html>
